ai_usage_summary: |
  Used Claude and ChatGPT as development assistants for architecture discussion, code
  review, profiling/optimization analysis, debugging, and test scaffolding. The
  engineering decisions, scoring design, and calibration are the team's own. No
  candidate data was sent to any LLM, and the ranking code makes no LLM or network calls.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Deterministic, CPU-only rule-based ranker — no ML model, embeddings, or network.
  The JD is encoded as nine weighted capability areas. Per candidate we (1) score
  demonstrated capability from career-history text using a curated phrase matcher —
  not a skills-list count, which is what defeats keyword-stuffers; (2) adjust it by an
  experience band, applied-ML tenure, JD anti-signals, and a nice-to-have bonus to get
  capability_fit; (3) compute a 0.5-1.0 behavioral multiplier from 14 engagement
  signals (recency, responsiveness, availability, logistics, trust); (4) force
  provably-impossible "honeypot" profiles to zero. final = honeypot ? 0 :
  capability_fit * behavioral_multiplier. The top 100 are selected with a streaming
  bounded min-heap (O(N log K) time, O(K) memory); each then gets a fact-grounded
  one-line reason (no hallucination), and a hard validator re-checks the CSV before
  writing. Runs the full 100K pool in ~2 minutes on CPU, is byte-identical across
  reruns, and passes the official validator with 0 honeypots in the top 100. The phrase
  matcher was profiled and optimized (6.7x faster). Ranking is robust to +/-15%
  constant mis-calibration (top-10 ~97% stable). See docs/METHODOLOGY.md.

